# Skill Governance Configuration
# 详见 ai-engineering-standards/11-AI-DevTools/Skill-Governance.md

version: "1.0"

policy:
  auto_install: false              # 禁止自动安装
  require_approval: true           # 启用前需审批
  auto_execute: false              # 禁止自动执行

enabled:
  - name: superpowers-zh
    category: workflow
    source:
      type: external               # external | local
      # path: ~/.cursor/skills/superpowers-zh
    scope:
      - development
      - refactoring
    approval:
      required: true
      approved_by: {{APPROVER}}
      approved_at: {{DATE}}
    auto_execute: false

  - name: grill-me
    category:
      - workflow
      - review
    source:
      type: external
      repository: mattpocock/skills
      url: https://github.com/mattpocock/skills
      skill_path: skills/productivity/grill-me/SKILL.md
      install: npx skills@latest add mattpocock/skills
      author: Matt Pocock
      license: MIT
      invoked_by: user              # user-invoked skill（用户手动调用 /grill-me）
    scope:
      - architecture
      - design-review
      - prd-review
      - plan-review                 # 方案审查
      - decision-review             # 决策树审查
    description: |
      Relentlessly interview the user about a plan or design
      until every branch of the decision tree is resolved.
      AI 主动连珠炮式提问，每次只问一个问题，倒逼用户把方案想清楚。
    capabilities:
      - 深度追问模式（逐层深挖细节、原理和边界）
      - 一次只问一个问题
      - 多场景适配（方案/设计/PRD/功能规划）
      - 轻量启动（3-5 句想法即可开始）
    not_for:
      - 普通编码（如修改 UserService.java）
      - 简单修改（typo、格式调整）
      - 需要"告诉我怎么做"的场景
    trigger:
      manual: true                  # 仅手动触发（/grill-me）
    auto_execute: false

