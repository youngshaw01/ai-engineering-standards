# Skill Governance Configuration
# 详见 ai-engineering-standards/11-AI-DevTools/Skill-Governance.md

version: "1.0"

policy:
  auto_install: false              # 禁止自动安装
  require_approval: true           # 启用前需审批
  auto_execute: false              # 禁止自动执行

enabled:
  - name: superpowers-zh
    category: workflow
    source:
      type: external               # external | local
      # path: ~/.cursor/skills/superpowers-zh
    scope:
      - development
      - refactoring
    approval:
      required: true
      approved_by: {{APPROVER}}
      approved_at: {{DATE}}
    auto_execute: false

  - name: grill-me
    category:
      - workflow
      - review
    source:
      type: external
    scope:
      - architecture
      - design-review
      - prd-review
    trigger:
      manual: true                  # 仅手动触发
    auto_execute: false

  # - name: java-review
  #   category: engineering
  #   scope:
  #     - backend
  #   auto_execute: false

  # - name: api-testing
  #   category: engineering
  #   scope:
  #     - api
  #   auto_execute: false

excluded:
  # - unknown-ai-agent             # 明确排除的 Skill
