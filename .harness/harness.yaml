# Harness Governance Configuration
# ai-engineering-standards 自身治理配置
# 详见 11-AI-DevTools/Harness-Bootstrap.md

version: "1.0"

maturity: standard

project:
  name: ai-engineering-standards
  type: new
  version_control: git

workspace:
  path: .harness/workspace/
  task_id_pattern: '{date}_{type}-{feature}'
  lifecycle:
    current: .harness/workspace/current/
    history: .harness/workspace/history/

context:
  strategy: layered
  layers_config: .harness/context/layers.yaml
  budget:
    target_fill_rate: 0.40
    principle: just_enough_context

knowledge:
  path: .harness/knowledge/
  index: .harness/knowledge/README.md

skills:
  path: .harness/skills/
  registry: .harness/skills/skills.yaml

rules:
  path: .harness/rules/
  inherit_global: false            # 本仓库即 Layer 0，规则在章节文档中

global_standards:
  source: self                     # 本仓库即全局标准源
  inherit:
    - safety
    - coding
    - api
    - testing
    - harness

adapters:
  enabled:
    - cursor
